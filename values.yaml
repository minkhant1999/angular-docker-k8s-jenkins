apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-rental
spec:
  replicas: 1
  selector:
    matchLabels:
      app: car-rental
  template:
    metadata:
      labels:
        app: car-rental
    spec:
      containers:
      - name: car-rental
        image: minkhant16999/car-rental:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: car-rental
spec:
  type: NodePort
  selector:
    app: car-rental
  ports:
    - protocol: TCP
      port: 80
      nodePort: 30080