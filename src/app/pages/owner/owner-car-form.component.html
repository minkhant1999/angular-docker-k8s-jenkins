<div class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
  <a routerLink="/owner" class="text-sm font-medium text-sky-700 hover:text-sky-900">← Dashboard</a>
  <h1 class="mt-4 text-2xl font-bold text-slate-900">{{ editId ? 'Edit car' : 'Add a car' }}</h1>
  <p class="mt-1 text-sm text-slate-600">Images are stored as base64 in your browser (demo only).</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label class="text-sm font-medium text-slate-700">Name</label>
        <input formControlName="name" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Model</label>
        <input formControlName="model" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Year</label>
        <input type="number" formControlName="year" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Price / day ($)</label>
        <input type="number" formControlName="pricePerDay" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div class="sm:col-span-2">
        <label class="text-sm font-medium text-slate-700">Location</label>
        <input formControlName="location" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="City, State" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Type</label>
        <input formControlName="carType" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="SUV, Electric…" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Seats</label>
        <input type="number" formControlName="seats" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Transmission</label>
        <input formControlName="transmission" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Fuel</label>
        <input formControlName="fuel" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" />
      </div>
      <div class="sm:col-span-2">
        <label class="text-sm font-medium text-slate-700">Description</label>
        <textarea formControlName="description" rows="3" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
      </div>
    </div>

    <div>
      <label class="text-sm font-medium text-slate-700">Photos</label>
      <input type="file" accept="image/*" multiple class="mt-1 block w-full text-sm" (change)="onFilesSelected($event)" />
      <div class="mt-3 flex flex-wrap gap-2">
        <div *ngFor="let img of imagePreviews; let i = index" class="relative h-20 w-28 overflow-hidden rounded-lg border">
          <img [src]="img" class="h-full w-full object-cover" alt="" />
          <button type="button" class="absolute right-1 top-1 rounded bg-white/90 px-1 text-xs" (click)="removeImage(i)">×</button>
        </div>
      </div>
    </div>

    <p *ngIf="error" class="text-sm text-red-600">{{ error }}</p>

    <button
      type="submit"
      [disabled]="saving || form.invalid"
      class="w-full rounded-xl bg-sky-600 py-3 font-semibold text-white disabled:opacity-50"
    >
      {{ saving ? 'Saving…' : 'Save listing' }}
    </button>
  </form>
</div>
