<div class="mx-auto max-w-md px-4 py-14 sm:px-6">
  <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-bold text-slate-900">Create account</h1>
    <p class="mt-2 text-sm text-slate-600">Sign up to book cars and save your preferences.</p>

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="block text-sm font-medium text-slate-700" for="name">Full name</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          autocomplete="name"
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
        />
        <p *ngIf="submitted && form.controls.name.invalid" class="mt-1 text-sm text-red-600">
          Enter your name (at least 2 characters).
        </p>
      </div>

      <div>
        <span class="block text-sm font-medium text-slate-700">I am signing up as</span>
        <div class="mt-2 flex flex-col gap-2 sm:flex-row">
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 px-4 py-3 hover:border-sky-300">
            <input type="radio" formControlName="role" value="customer" class="text-sky-600" />
            <span class="text-sm text-slate-800">Customer — browse &amp; book cars</span>
          </label>
          <label class="flex cursor-pointer items-center gap-2 rounded-xl border border-slate-200 px-4 py-3 hover:border-sky-300">
            <input type="radio" formControlName="role" value="owner" class="text-sky-600" />
            <span class="text-sm text-slate-800">Car owner — list your fleet (wire to API later)</span>
          </label>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700" for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
        />
        <p *ngIf="submitted && form.controls.email.invalid" class="mt-1 text-sm text-red-600">
          Enter a valid email.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700" for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
        />
        <p *ngIf="submitted && form.controls.password.invalid" class="mt-1 text-sm text-red-600">
          Use at least 6 characters.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700" for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2.5 shadow-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/30"
        />
        <p *ngIf="submitted && form.controls.confirmPassword.invalid" class="mt-1 text-sm text-red-600">
          Please confirm your password.
        </p>
      </div>

      <div *ngIf="error" class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-800">
        {{ error }}
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-sky-600 py-3 font-semibold text-white shadow-lg shadow-sky-900/20 transition hover:bg-sky-500"
      >
        Create account
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-600">
      Already have an account?
      <a routerLink="/login" class="font-semibold text-sky-700 hover:text-sky-900">Log in</a>
    </p>
  </div>
</div>
