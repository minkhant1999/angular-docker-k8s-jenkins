<div class="mx-auto flex max-w-2xl flex-col px-4 py-6 sm:px-6" style="min-height: calc(100vh - 12rem)">
  <div class="flex items-center gap-3 border-b border-slate-200 pb-4">
    <a routerLink="/inbox" class="text-sky-700 hover:text-sky-900">←</a>
    <h1 class="text-lg font-bold text-slate-900">Chat</h1>
  </div>

  <div class="flex-1 space-y-3 overflow-y-auto py-4">
    <p *ngIf="loading" class="text-slate-500">Loading…</p>
    <div
      *ngFor="let m of messages"
      class="flex"
      [ngClass]="{ 'justify-end': isMine(m), 'justify-start': !isMine(m) }"
    >
      <div
        class="max-w-[85%] rounded-2xl px-4 py-2 text-sm shadow-sm"
        [ngClass]="isMine(m) ? 'bg-sky-600 text-white' : 'bg-slate-100 text-slate-900'"
      >
        <p class="text-xs opacity-80">{{ m.senderName }} · {{ m.createdAt | date : 'shortTime' }}</p>
        <p class="mt-1 whitespace-pre-wrap">{{ m.text }}</p>
      </div>
    </div>
  </div>

  <div class="flex gap-2 border-t border-slate-200 pt-4">
    <input
      [(ngModel)]="draft"
      (keyup.enter)="send()"
      class="flex-1 rounded-xl border border-slate-300 px-3 py-2"
      placeholder="Type a message…"
    />
    <button type="button" class="rounded-xl bg-slate-900 px-4 py-2 font-semibold text-white" (click)="send()">Send</button>
  </div>
</div>
