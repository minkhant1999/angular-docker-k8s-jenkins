<div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
  <h1 class="text-2xl font-bold text-slate-900">My bookings</h1>
  <p class="mt-1 text-slate-600">Stored locally in your browser.</p>

  <div *ngIf="loading" class="mt-8 text-slate-600">Loading…</div>

  <div *ngIf="!loading && bookings.length === 0" class="mt-8 rounded-2xl border border-dashed border-slate-200 p-8 text-center text-slate-600">
    No bookings yet.
    <a routerLink="/" class="mt-2 block font-medium text-sky-700">Browse cars</a>
  </div>

  <ul *ngIf="!loading && bookings.length" class="mt-6 space-y-4">
    <li *ngFor="let b of bookings" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="font-semibold text-slate-900">
            <a [routerLink]="['/cars', b.carId]" class="text-sky-700 hover:underline">View car</a>
            <span class="text-slate-400"> · {{ b.carId }}</span>
          </p>
          <p class="text-sm text-slate-600">{{ b.startDate }} → {{ b.endDate }} · {{ b.destination }}</p>
          <p class="mt-2 text-lg font-bold text-sky-700">${{ b.estimatedTotal | number : '1.2-2' }}</p>
        </div>
        <span
          class="rounded-full px-3 py-1 text-xs font-semibold uppercase"
          [ngClass]="{
            'bg-amber-100 text-amber-800': b.status === 'pending',
            'bg-emerald-100 text-emerald-800': b.status === 'approved',
            'bg-red-100 text-red-800': b.status === 'rejected'
          }"
        >
          {{ b.status }}
        </span>
      </div>
    </li>
  </ul>
</div>
